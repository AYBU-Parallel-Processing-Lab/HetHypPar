<svg xmlns="http://www.w3.org/2000/svg" width="980" height="320" viewBox="0 0 980 320" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#444"/></marker>
    <marker id="agr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#b03030"/></marker>
  </defs>
  <rect width="980" height="320" fill="#ffffff"/>

  <text x="24" y="26" font-size="18" font-weight="700" fill="#1a1a1a">Pipelined BiCGStab over multiple iterations — iterations are serial</text>
  <text x="24" y="46" font-size="12" fill="#555">X = real time. Within each iteration the reduce overlaps a SpMV (green columns). But iteration i+1 waits for iteration i's last reduce (β) — no cross-iteration overlap.</text>

  <!-- iteration background bands (per iter = 13 units, unit=26px, x0=140) -->
  <rect x="140" y="64" width="338" height="150" fill="#eef4fb"/>
  <rect x="478" y="64" width="338" height="150" fill="#fbf3e8"/>
  <rect x="816" y="64" width="164" height="150" fill="#eef4fb"/>
  <line x1="478" y1="64" x2="478" y2="248" stroke="#b03030" stroke-width="1.4" stroke-dasharray="5 3"/>
  <line x1="816" y1="64" x2="816" y2="248" stroke="#b03030" stroke-width="1.4" stroke-dasharray="5 3"/>

  <text x="309" y="80" font-size="12.5" font-weight="700" fill="#2c5e9e" text-anchor="middle">iteration i</text>
  <text x="647" y="80" font-size="12.5" font-weight="700" fill="#9a6a1e" text-anchor="middle">iteration i+1</text>
  <text x="898" y="80" font-size="12.5" font-weight="700" fill="#2c5e9e" text-anchor="middle">iteration i+2 …</text>

  <!-- overlap highlight columns (SpMV+reduce running together) -->
  <g fill="#dff5dd">
    <rect x="192" y="96" width="104" height="118"/><rect x="335" y="96" width="104" height="118"/>
    <rect x="530" y="96" width="104" height="118"/><rect x="673" y="96" width="104" height="118"/>
    <rect x="868" y="96" width="92"  height="118"/>
  </g>

  <text x="20" y="120" font-size="11" font-weight="600" fill="#333">compute</text>
  <text x="20" y="174" font-size="11" font-weight="600" fill="#333">network</text>

  <!-- COMPUTE lane (continuous, no idle) y=100 h=36 -->
  <g font-size="10.5" text-anchor="middle">
    <!-- iter i -->
    <rect x="140" y="100" width="52"  height="36" rx="3" fill="#7fb07a"/><text x="166" y="122" fill="#fff">rec</text>
    <rect x="192" y="100" width="104" height="36" rx="3" fill="#3b75c4"/><text x="244" y="122" fill="#fff">SpMV v=Az</text>
    <rect x="296" y="100" width="39"  height="36" rx="3" fill="#7fb07a"/><text x="315" y="122" fill="#fff" font-size="9">x,r,w</text>
    <rect x="335" y="100" width="104" height="36" rx="3" fill="#3b75c4"/><text x="387" y="122" fill="#fff">SpMV t=Aw</text>
    <rect x="439" y="100" width="39"  height="36" rx="3" fill="#7fb07a"/><text x="458" y="122" fill="#fff" font-size="9">scl</text>
    <!-- iter i+1 -->
    <rect x="478" y="100" width="52"  height="36" rx="3" fill="#7fb07a"/><text x="504" y="122" fill="#fff">rec</text>
    <rect x="530" y="100" width="104" height="36" rx="3" fill="#3b75c4"/><text x="582" y="122" fill="#fff">SpMV v=Az</text>
    <rect x="634" y="100" width="39"  height="36" rx="3" fill="#7fb07a"/><text x="653" y="122" fill="#fff" font-size="9">x,r,w</text>
    <rect x="673" y="100" width="104" height="36" rx="3" fill="#3b75c4"/><text x="725" y="122" fill="#fff">SpMV t=Aw</text>
    <rect x="777" y="100" width="39"  height="36" rx="3" fill="#7fb07a"/><text x="796" y="122" fill="#fff" font-size="9">scl</text>
    <!-- iter i+2 -->
    <rect x="816" y="100" width="52"  height="36" rx="3" fill="#7fb07a"/><text x="842" y="122" fill="#fff">rec</text>
    <rect x="868" y="100" width="104" height="36" rx="3" fill="#3b75c4"/><text x="916" y="122" fill="#fff">SpMV v=Az</text>
  </g>

  <!-- NETWORK lane (gaps between reduces) y=156 h=36 -->
  <g font-size="11" text-anchor="middle">
    <rect x="192" y="156" width="78" height="36" rx="3" fill="#e39a2e"/><text x="231" y="178" fill="#fff">reduce ω</text>
    <rect x="335" y="156" width="78" height="36" rx="3" fill="#e39a2e"/><text x="374" y="178" fill="#fff">red α,β</text>
    <rect x="530" y="156" width="78" height="36" rx="3" fill="#e39a2e"/><text x="569" y="178" fill="#fff">reduce ω</text>
    <rect x="673" y="156" width="78" height="36" rx="3" fill="#e39a2e"/><text x="712" y="178" fill="#fff">red α,β</text>
    <rect x="868" y="156" width="78" height="36" rx="3" fill="#e39a2e"/><text x="907" y="178" fill="#fff">reduce ω</text>
  </g>
  <!-- network idle markers -->
  <g font-size="9" fill="#bb7a30" text-anchor="middle" font-style="italic">
    <text x="305" y="178">idle</text><text x="455" y="178">idle</text>
    <text x="643" y="178">idle</text><text x="793" y="178">idle</text>
  </g>

  <!-- serial-boundary dependency arrow: iter i reduce α,β  ->  iter i+1 first recurrence -->
  <path d="M 413 156 C 430 222, 470 222, 504 138" fill="none" stroke="#b03030" stroke-width="1.7" stroke-dasharray="5 3" marker-end="url(#agr)"/>
  <text x="470" y="238" font-size="10.5" font-weight="700" fill="#b03030" text-anchor="middle">βᵢ from iter i's reduce → needed before iter i+1 can start  (SERIAL boundary)</text>

  <!-- time ruler -->
  <line x1="140" y1="262" x2="975" y2="262" stroke="#444" marker-end="url(#ag)"/>
  <g font-size="9.5" fill="#666" text-anchor="middle">
    <text x="140" y="278">0</text><text x="244" y="278">4</text><text x="348" y="278">8</text>
    <text x="452" y="278">12</text><text x="556" y="278">16</text><text x="660" y="278">20</text>
    <text x="764" y="278">24</text><text x="868" y="278">28</text>
  </g>
  <text x="760" y="256" font-size="11" fill="#444">time →</text>

  <!-- takeaways -->
  <text x="24" y="300" font-size="11.5" fill="#333"><tspan font-weight="700" fill="#2f7d32">Compute lane: never idle</tspan> (continuous) — that's the win.   <tspan font-weight="700" fill="#bb7a30">Network: idle in the gaps</tspan>, busy only for the 2 reduces/iter, each hidden under a SpMV.</text>
  <text x="24" y="316" font-size="11.5" fill="#333"><tspan font-weight="700" fill="#b03030">Iterations are serial</tspan> — i+1 waits for i's β reduce. Overlapping whole iterations (deeper pipeline) is NOT in this method; it's future work in the paper.</text>
</svg>
