<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="adk" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#b03030"/></marker>
  </defs>
  <rect width="1000" height="470" fill="#ffffff"/>

  <text x="28" y="30" font-size="20" font-weight="700" fill="#1a1a1a">Why the extra compute is affordable — and why it would NOT be for our solver</text>
  <text x="28" y="52" font-size="12.5" fill="#555">CA trades computation for fewer syncs — pays only if the extra compute is cheap. Tensor cores deliver that only for compute-bound kernels.</text>

  <!-- ZONE A: compute-bound -->
  <rect x="28" y="70" width="944" height="96" rx="6" fill="#eafaf3" stroke="#3b9c8f" stroke-dasharray="5 3"/>
  <text x="42" y="90" font-size="13" font-weight="700" fill="#1f7a6c">COMPUTE-BOUND  →  tensor cores give 4–16×  (THIS is what makes communication-avoiding pay off)</text>
  <g font-size="11.5" text-anchor="middle">
    <rect x="44" y="100" width="240" height="54" rx="5" fill="#3b9c8f"/><text x="164" y="122" fill="#fff" font-size="13" font-weight="600">Gram GEMM  G = YYᵀ</text><text x="164" y="140" fill="#d6f0ea" font-size="10">BF16 in / FP32 accum · 92% of BF16 peak</text>
  </g>
  <text x="300" y="123" font-size="11.5" fill="#1f7a6c">← the (sb)² cost CA <tspan font-weight="700">adds</tspan>. At FP32 it would sink the method;</text>
  <text x="300" y="140" font-size="11.5" fill="#1f7a6c">on BF16 tensor cores it is ~4–16× faster, so the trade wins.</text>

  <!-- ZONE B: memory-bound -->
  <rect x="28" y="178" width="944" height="96" rx="6" fill="#fff5e8" stroke="#e39a2e" stroke-dasharray="5 3"/>
  <text x="42" y="198" font-size="13" font-weight="700" fill="#bb7a30">MEMORY-BOUND  →  no tensor-core benefit; only 2× from halved BF16 reads</text>
  <g font-size="11.5" text-anchor="middle">
    <rect x="44" y="208" width="190" height="54" rx="5" fill="#e0a64a"/><text x="139" y="230" fill="#fff" font-weight="600">margin GEMV  r = Yx</text><text x="139" y="248" fill="#fbe6cb" font-size="10">BF16 · 0.5–1.0 FLOP/B</text>
    <rect x="246" y="208" width="190" height="54" rx="5" fill="#e0a64a"/><text x="341" y="230" fill="#fff" font-weight="600">grad GEMV  g = Yᵀδ</text><text x="341" y="248" fill="#fbe6cb" font-size="10">BF16 · 0.5–1.0 FLOP/B</text>
  </g>
  <text x="455" y="231" font-size="11.5" fill="#bb7a30">bandwidth-bound at every precision — tensor cores sit idle;</text>
  <text x="455" y="248" font-size="11.5" fill="#bb7a30">the only gain is a 2× drop in traffic from BF16 storage.</text>

  <!-- ZONE C: must stay FP32 -->
  <rect x="28" y="286" width="944" height="84" rx="6" fill="#eef0f6" stroke="#6b6f8c" stroke-dasharray="5 3"/>
  <text x="42" y="306" font-size="13" font-weight="700" fill="#4c5070">MUST STAY FP32  →  error-sensitive (the nine-slot analysis' hard constraint)</text>
  <g font-size="11" text-anchor="middle">
    <rect x="44" y="316" width="210" height="44" rx="5" fill="#6b6f8c"/><text x="149" y="338" fill="#fff" font-weight="600">inner correction sum  z⁽ʲ⁾</text><text x="149" y="352" fill="#d8dae6" font-size="9.5">accumulates over s steps</text>
    <rect x="266" y="316" width="150" height="44" rx="5" fill="#6b6f8c"/><text x="341" y="338" fill="#fff" font-weight="600">residual / sigmoid δ</text>
    <rect x="428" y="316" width="150" height="44" rx="5" fill="#6b6f8c"/><text x="503" y="338" fill="#fff" font-weight="600">weight update x</text>
    <rect x="590" y="316" width="170" height="44" rx="5" fill="#6b6f8c"/><text x="675" y="334" fill="#fff" font-weight="600">Gram AllReduce</text><text x="675" y="351" fill="#d8dae6" font-size="9">(Recipe D: BF16, riskier)</text>
  </g>

  <!-- connection to our work -->
  <rect x="28" y="384" width="944" height="74" rx="6" fill="#fdecec" stroke="#b03030"/>
  <text x="42" y="406" font-size="13" font-weight="700" fill="#b03030">What transfers to our heterogeneous BiCGStab</text>
  <text x="42" y="426" font-size="11.5" fill="#7a2222">Our sparse FP64 SpMV is a <tspan font-weight="700">memory-bound</tspan> kernel — it lives in the orange zone, exactly like these GEMVs. Tensor cores give us nothing.</text>
  <text x="42" y="444" font-size="11.5" fill="#7a2222">Only the <tspan font-weight="700">2× bandwidth-halving</tspan> transfers (store A / vectors in lower precision, + iterative refinement) — and 2× could beat our 1.3× CPU offload.</text>
</svg>
