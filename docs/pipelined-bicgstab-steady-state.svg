<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2f7d32"/>
    </marker>
  </defs>
  <rect width="1000" height="340" fill="#ffffff"/>

  <text x="30" y="30" font-size="19" font-weight="700" fill="#1a1a1a">3.  Steady-state pipeline — why it's called a "pipeline"</text>
  <text x="30" y="52" font-size="12.5" fill="#555">Two consecutive iterations. COMM is never exposed: every reduction sits under a SpMV, and each SpMV's output feeds the next iteration.</text>

  <!-- iteration background bands -->
  <rect x="150" y="70" width="410" height="162" fill="#eef4fb"/>
  <rect x="560" y="70" width="410" height="162" fill="#fbf3e8"/>
  <line x1="150" y1="70" x2="150" y2="232" stroke="#bbb" stroke-dasharray="3 3"/>
  <line x1="560" y1="70" x2="560" y2="232" stroke="#bbb" stroke-dasharray="3 3"/>
  <line x1="970" y1="70" x2="970" y2="232" stroke="#bbb" stroke-dasharray="3 3"/>

  <!-- lane labels -->
  <text x="22" y="146" font-size="12" font-weight="600" fill="#333">COMPUTE</text>
  <text x="22" y="206" font-size="12" font-weight="600" fill="#333">COMM</text>

  <!-- carry-forward arc (above the lanes) -->
  <path d="M 380 116 C 460 84, 540 84, 610 116" fill="none" stroke="#2f7d32" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#ar)"/>
  <text x="496" y="78" font-size="11.5" font-weight="600" fill="#2f7d32" text-anchor="middle">outputs  v=Az,  t=Aw,  w  →  feed next iteration's recurrences</text>

  <!-- COMPUTE row y=120 h=42 -->
  <g font-size="12" text-anchor="middle">
    <!-- iteration i -->
    <rect x="150" y="120" width="105" height="42" rx="4" fill="#7fb07a"/><text x="202" y="146" fill="#fff">recurrences</text>
    <rect x="255" y="120" width="105" height="42" rx="4" fill="#3b75c4"/><text x="307" y="146" fill="#fff">SpMV v=Az</text>
    <rect x="360" y="120" width="50"  height="42" rx="4" fill="#7fb07a"/><text x="385" y="146" fill="#fff">x,r,w</text>
    <rect x="410" y="120" width="105" height="42" rx="4" fill="#3b75c4"/><text x="462" y="146" fill="#fff">SpMV t=Aw</text>
    <rect x="515" y="120" width="45"  height="42" rx="4" fill="#7fb07a"/><text x="537" y="146" fill="#fff" font-size="10.5">scalars</text>
    <!-- iteration i+1 -->
    <rect x="560" y="120" width="105" height="42" rx="4" fill="#7fb07a"/><text x="612" y="146" fill="#fff">recurrences</text>
    <rect x="665" y="120" width="105" height="42" rx="4" fill="#3b75c4"/><text x="717" y="146" fill="#fff">SpMV v=Az</text>
    <rect x="770" y="120" width="50"  height="42" rx="4" fill="#7fb07a"/><text x="795" y="146" fill="#fff">x,r,w</text>
    <rect x="820" y="120" width="105" height="42" rx="4" fill="#3b75c4"/><text x="872" y="146" fill="#fff">SpMV t=Aw</text>
    <rect x="925" y="120" width="45"  height="42" rx="4" fill="#7fb07a"/><text x="947" y="146" fill="#fff" font-size="10.5">scalars</text>
  </g>

  <!-- COMM row y=180 h=42, each reduce directly under a SpMV -->
  <g font-size="12.5" text-anchor="middle">
    <rect x="255" y="180" width="105" height="42" rx="4" fill="#e39a2e"/><text x="307" y="206" fill="#fff">reduce ω</text>
    <rect x="410" y="180" width="105" height="42" rx="4" fill="#e39a2e"/><text x="462" y="206" fill="#fff">reduce α,β</text>
    <rect x="665" y="180" width="105" height="42" rx="4" fill="#e39a2e"/><text x="717" y="206" fill="#fff">reduce ω</text>
    <rect x="820" y="180" width="105" height="42" rx="4" fill="#e39a2e"/><text x="872" y="206" fill="#fff">reduce α,β</text>
  </g>

  <!-- overlap tick marks between the two lanes -->
  <g font-size="13" font-weight="700" fill="#2f7d32" text-anchor="middle">
    <text x="307" y="176">⇅</text><text x="462" y="176">⇅</text>
    <text x="717" y="176">⇅</text><text x="872" y="176">⇅</text>
  </g>

  <!-- iteration banners -->
  <text x="355" y="250" font-size="12.5" font-weight="700" fill="#2c5e9e" text-anchor="middle">iteration  i</text>
  <text x="765" y="250" font-size="12.5" font-weight="700" fill="#9a6a1e" text-anchor="middle">iteration  i+1</text>

  <!-- time arrow -->
  <line x1="150" y1="272" x2="975" y2="272" stroke="#444" marker-end="url(#ar)" style="marker-end:url(#ar)"/>
  <text x="150" y="290" font-size="11" fill="#444">time →</text>

  <!-- takeaway -->
  <text x="500" y="312" font-size="12.5" font-weight="600" fill="#2f7d32" text-anchor="middle">Each iteration: 2 reductions, each hidden under a SpMV. COMPUTE never stalls (the win); the network is idle between reduces. Iterations run serially.</text>
  <text x="500" y="330" font-size="11.5" fill="#555" text-anchor="middle">The auxiliary vectors w=Ar, z=As, t=Aw carry across iterations — that's what lets each iteration's SpMV start without waiting on that iteration's own reduce.</text>
</svg>
