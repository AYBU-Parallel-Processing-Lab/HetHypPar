<svg xmlns="http://www.w3.org/2000/svg" width="860" height="600" viewBox="0 0 860 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#fde3e3"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#e08a8a" stroke-width="2.4"/>
    </pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#444"/>
    </marker>
  </defs>

  <rect width="860" height="600" fill="#ffffff"/>
  <text x="30" y="34" font-size="20" font-weight="700" fill="#1a1a1a">Where the overlap happens in pipelined BiCGStab</text>
  <text x="30" y="56" font-size="13" fill="#555">One iteration, time flowing left to right. Two lanes: COMPUTE (local SpMV + vector ops) and COMM (the global reduction).</text>

  <!-- ============ PANEL 1: STANDARD ============ -->
  <text x="30" y="92" font-size="15" font-weight="700" fill="#b03030">1.  Standard BiCGStab — 3 reductions, none overlapped (COMPUTE idles during every reduce)</text>

  <!-- lane labels -->
  <text x="20" y="126" font-size="12" font-weight="600" fill="#333">COMPUTE</text>
  <text x="20" y="140" font-size="10" fill="#777">SpMV + vec</text>
  <text x="20" y="190" font-size="12" font-weight="600" fill="#333">COMM</text>
  <text x="20" y="204" font-size="10" fill="#777">reduce</text>

  <!-- baseline lanes -->
  <line x1="140" y1="100" x2="800" y2="100" stroke="#ddd"/>
  <line x1="140" y1="208" x2="800" y2="208" stroke="#ddd"/>

  <!-- COMPUTE row  (y=104 h=44) -->
  <g font-size="12.5" text-anchor="middle">
    <rect x="140" y="104" width="110" height="44" rx="4" fill="#3b75c4"/><text x="195" y="131" fill="#fff">SpMV  s=Ap</text>
    <rect x="250" y="104" width="80"  height="44" rx="4" fill="url(#hatch)"/><text x="290" y="131" fill="#a33" font-style="italic">idle</text>
    <rect x="330" y="104" width="60"  height="44" rx="4" fill="#7fb07a"/><text x="360" y="131" fill="#fff">q=r−αs</text>
    <rect x="390" y="104" width="110" height="44" rx="4" fill="#3b75c4"/><text x="445" y="131" fill="#fff">SpMV  y=Aq</text>
    <rect x="500" y="104" width="80"  height="44" rx="4" fill="url(#hatch)"/><text x="540" y="131" fill="#a33" font-style="italic">idle</text>
    <rect x="580" y="104" width="60"  height="44" rx="4" fill="#7fb07a"/><text x="610" y="131" fill="#fff">x,r</text>
    <rect x="640" y="104" width="80"  height="44" rx="4" fill="url(#hatch)"/><text x="680" y="131" fill="#a33" font-style="italic">idle</text>
    <rect x="720" y="104" width="55"  height="44" rx="4" fill="#7fb07a"/><text x="747" y="131" fill="#fff">p</text>
  </g>
  <!-- COMM row (y=168 h=44) -->
  <g font-size="13" text-anchor="middle">
    <rect x="250" y="168" width="80" height="44" rx="4" fill="#e39a2e"/><text x="290" y="195" fill="#fff">reduce α</text>
    <rect x="500" y="168" width="80" height="44" rx="4" fill="#e39a2e"/><text x="540" y="195" fill="#fff">reduce ω</text>
    <rect x="640" y="168" width="80" height="44" rx="4" fill="#e39a2e"/><text x="680" y="195" fill="#fff">reduce β</text>
  </g>
  <!-- idle/serial markers -->
  <g font-size="10" fill="#b03030" text-anchor="middle">
    <text x="290" y="232">↑ compute waits</text>
    <text x="540" y="232">↑ compute waits</text>
    <text x="680" y="232">↑ compute waits</text>
  </g>
  <!-- time arrow + total length -->
  <line x1="140" y1="250" x2="775" y2="250" stroke="#444" marker-end="url(#arrow)"/>
  <text x="785" y="254" font-size="11" fill="#444">time</text>
  <line x1="775" y1="100" x2="775" y2="250" stroke="#b03030" stroke-dasharray="4 3"/>
  <text x="455" y="268" font-size="11.5" font-weight="600" fill="#b03030" text-anchor="middle">1 iteration  =  3 reduce  +  2 SpMV  +  vec  (reductions fully exposed)</text>

  <!-- ============ PANEL 2: PIPELINED ============ -->
  <text x="30" y="330" font-size="15" font-weight="700" fill="#2f7d32">2.  Pipelined BiCGStab — 2 reductions, EACH hidden behind a SpMV (lanes run at once)</text>

  <text x="20" y="382" font-size="12" font-weight="600" fill="#333">COMPUTE</text>
  <text x="20" y="396" font-size="10" fill="#777">SpMV + vec</text>
  <text x="20" y="446" font-size="12" font-weight="600" fill="#333">COMM</text>
  <text x="20" y="460" font-size="10" fill="#777">reduce</text>

  <line x1="140" y1="356" x2="800" y2="356" stroke="#ddd"/>
  <line x1="140" y1="464" x2="800" y2="464" stroke="#ddd"/>

  <!-- overlap highlight boxes (drawn first, behind) -->
  <rect x="285" y="356" width="150" height="108" rx="6" fill="#eafbe9" stroke="#2f7d32" stroke-dasharray="5 3"/>
  <rect x="500" y="356" width="150" height="108" rx="6" fill="#eafbe9" stroke="#2f7d32" stroke-dasharray="5 3"/>

  <!-- COMPUTE row (y=360 h=44) -->
  <g font-size="12.5" text-anchor="middle">
    <rect x="140" y="360" width="145" height="44" rx="4" fill="#7fb07a"/><text x="212" y="387" fill="#fff">recurrences p,s,z,q,y</text>
    <rect x="290" y="360" width="140" height="44" rx="4" fill="#3b75c4"/><text x="360" y="387" fill="#fff">SpMV  v=Az</text>
    <rect x="435" y="360" width="60"  height="44" rx="4" fill="#7fb07a"/><text x="465" y="387" fill="#fff">x,r,w</text>
    <rect x="505" y="360" width="140" height="44" rx="4" fill="#3b75c4"/><text x="575" y="387" fill="#fff">SpMV  t=Aw</text>
    <rect x="650" y="360" width="55"  height="44" rx="4" fill="#7fb07a"/><text x="677" y="387" fill="#fff">scalars</text>
  </g>
  <!-- COMM row (y=420 h=44) aligned UNDER the SpMVs -->
  <g font-size="13" text-anchor="middle">
    <rect x="290" y="420" width="140" height="44" rx="4" fill="#e39a2e"/><text x="360" y="447" fill="#fff">reduce ω</text>
    <rect x="505" y="420" width="140" height="44" rx="4" fill="#e39a2e"/><text x="575" y="447" fill="#fff">reduce α,β</text>
  </g>
  <!-- overlap labels -->
  <g font-size="11" font-weight="700" fill="#2f7d32" text-anchor="middle">
    <text x="360" y="480">⇅ overlapped — reduce hidden</text>
    <text x="575" y="480">⇅ overlapped — reduce hidden</text>
  </g>

  <!-- time arrow + total length -->
  <line x1="140" y1="500" x2="705" y2="500" stroke="#444" marker-end="url(#arrow)"/>
  <text x="715" y="504" font-size="11" fill="#444">time</text>
  <line x1="705" y1="356" x2="705" y2="500" stroke="#2f7d32" stroke-dasharray="4 3"/>
  <!-- where standard ended, for comparison -->
  <line x1="775" y1="356" x2="775" y2="500" stroke="#b03030" stroke-dasharray="2 3" opacity="0.7"/>
  <text x="775" y="516" font-size="10" fill="#b03030" text-anchor="middle">standard ended here</text>
  <text x="420" y="500" font-size="11.5" font-weight="600" fill="#2f7d32" text-anchor="middle">shorter — comm hidden under compute</text>

  <!-- ============ LEGEND ============ -->
  <g font-size="12" transform="translate(30,552)">
    <rect x="0"   y="0" width="20" height="14" rx="3" fill="#3b75c4"/><text x="26" y="11" fill="#333">SpMV (sparse mat-vec)</text>
    <rect x="180" y="0" width="20" height="14" rx="3" fill="#7fb07a"/><text x="206" y="11" fill="#333">vector ops / recurrences</text>
    <rect x="370" y="0" width="20" height="14" rx="3" fill="#e39a2e"/><text x="396" y="11" fill="#333">global reduction (Allreduce / CPU↔GPU)</text>
    <rect x="650" y="0" width="20" height="14" rx="3" fill="url(#hatch)"/><text x="676" y="11" fill="#333">idle (stalled)</text>
  </g>
</svg>
