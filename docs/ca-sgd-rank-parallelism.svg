<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2f7d32"/></marker>
    <marker id="ak" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a4fa3"/></marker>
    <marker id="ad" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#444"/></marker>
  </defs>
  <rect width="1000" height="430" fill="#ffffff"/>

  <text x="28" y="30" font-size="20" font-weight="700" fill="#1a1a1a">CA-SGD across P ranks — one outer iteration: where it's parallel, where it's serial</text>
  <text x="28" y="52" font-size="12.5" fill="#555">Each rank owns a column-slice of the features (n_loc = n/P). Time flows left to right; the four rank lanes run concurrently.</text>

  <!-- phase header brackets -->
  <g font-size="11.5" font-weight="700" text-anchor="middle">
    <text x="245" y="78" fill="#2c5e9e">local — parallel across ranks</text>
    <text x="469" y="78" fill="#bb7a30">1 sync</text>
    <text x="643" y="78" fill="#7a4fa3">redundant · serial within rank</text>
    <text x="858" y="78" fill="#2c5e9e">local slice</text>
  </g>
  <g stroke="#bbb" stroke-width="1">
    <line x1="120" y1="84" x2="372" y2="84"/><line x1="430" y1="84" x2="508" y2="84"/>
    <line x1="520" y1="84" x2="782" y2="84"/><line x1="792" y1="84" x2="924" y2="84"/>
  </g>

  <!-- AllReduce barrier band spanning all lanes (draw first, behind) -->
  <rect x="430" y="92" width="78" height="262" fill="#e39a2e"/>
  <text x="469" y="223" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" transform="rotate(-90 469 223)">grouped AllReduce  [ r ; G ]</text>

  <!-- rank lanes -->
  <g font-size="12" font-weight="700" fill="#333">
    <text x="20" y="120">P0</text><text x="20" y="184">P1</text><text x="20" y="248">P2</text><text x="20" y="312">P3</text>
  </g>

  <!-- per-rank rows: local-compute box | (barrier) | 4 inner steps | grad/update -->
  <!-- y positions: P0=98, P1=162, P2=226, P3=290 ; h=44 -->
  <g font-size="10.5" text-anchor="middle">
    <!-- P0 -->
    <rect x="120" y="98" width="252" height="44" rx="4" fill="#3b75c4"/><text x="246" y="120" fill="#fff">r=Y₀x  ‖  G=Y₀Y₀ᵀ</text><text x="246" y="134" fill="#cfe0f5" font-size="9">local GEMM/GEMV (BF16 TC)</text>
    <rect x="520" y="98" width="60" height="44" rx="3" fill="#9b7fc4"/><text x="550" y="124" fill="#fff" font-size="9.5">z⁽⁰⁾</text>
    <rect x="582" y="98" width="60" height="44" rx="3" fill="#9b7fc4"/><text x="612" y="124" fill="#fff" font-size="9.5">z⁽¹⁾</text>
    <rect x="644" y="98" width="60" height="44" rx="3" fill="#9b7fc4"/><text x="674" y="124" fill="#fff" font-size="9.5">z⁽²⁾</text>
    <rect x="706" y="98" width="60" height="44" rx="3" fill="#9b7fc4"/><text x="736" y="124" fill="#fff" font-size="9.5">z⁽³⁾</text>
    <rect x="792" y="98" width="132" height="44" rx="4" fill="#3b75c4"/><text x="858" y="120" fill="#fff">g=Y₀ᵀδ ; x₀+=ηg</text><text x="858" y="134" fill="#cfe0f5" font-size="9">local update</text>
    <!-- P1 -->
    <rect x="120" y="162" width="252" height="44" rx="4" fill="#3b75c4"/><text x="246" y="184" fill="#fff">r=Y₁x  ‖  G=Y₁Y₁ᵀ</text><text x="246" y="198" fill="#cfe0f5" font-size="9">local GEMM/GEMV (BF16 TC)</text>
    <rect x="520" y="162" width="60" height="44" rx="3" fill="#9b7fc4"/><text x="550" y="188" fill="#fff" font-size="9.5">z⁽⁰⁾</text>
    <rect x="582" y="162" width="60" height="44" rx="3" fill="#9b7fc4"/><text x="612" y="188" fill="#fff" font-size="9.5">z⁽¹⁾</text>
    <rect x="644" y="162" width="60" height="44" rx="3" fill="#9b7fc4"/><text x="674" y="188" fill="#fff" font-size="9.5">z⁽²⁾</text>
    <rect x="706" y="162" width="60" height="44" rx="3" fill="#9b7fc4"/><text x="736" y="188" fill="#fff" font-size="9.5">z⁽³⁾</text>
    <rect x="792" y="162" width="132" height="44" rx="4" fill="#3b75c4"/><text x="858" y="184" fill="#fff">g=Y₁ᵀδ ; x₁+=ηg</text><text x="858" y="198" fill="#cfe0f5" font-size="9">local update</text>
    <!-- P2 -->
    <rect x="120" y="226" width="252" height="44" rx="4" fill="#3b75c4"/><text x="246" y="248" fill="#fff">r=Y₂x  ‖  G=Y₂Y₂ᵀ</text><text x="246" y="262" fill="#cfe0f5" font-size="9">local GEMM/GEMV (BF16 TC)</text>
    <rect x="520" y="226" width="60" height="44" rx="3" fill="#9b7fc4"/><text x="550" y="252" fill="#fff" font-size="9.5">z⁽⁰⁾</text>
    <rect x="582" y="226" width="60" height="44" rx="3" fill="#9b7fc4"/><text x="612" y="252" fill="#fff" font-size="9.5">z⁽¹⁾</text>
    <rect x="644" y="226" width="60" height="44" rx="3" fill="#9b7fc4"/><text x="674" y="252" fill="#fff" font-size="9.5">z⁽²⁾</text>
    <rect x="706" y="226" width="60" height="44" rx="3" fill="#9b7fc4"/><text x="736" y="252" fill="#fff" font-size="9.5">z⁽³⁾</text>
    <rect x="792" y="226" width="132" height="44" rx="4" fill="#3b75c4"/><text x="858" y="248" fill="#fff">g=Y₂ᵀδ ; x₂+=ηg</text><text x="858" y="262" fill="#cfe0f5" font-size="9">local update</text>
    <!-- P3 -->
    <rect x="120" y="290" width="252" height="44" rx="4" fill="#3b75c4"/><text x="246" y="312" fill="#fff">r=Y₃x  ‖  G=Y₃Y₃ᵀ</text><text x="246" y="326" fill="#cfe0f5" font-size="9">local GEMM/GEMV (BF16 TC)</text>
    <rect x="520" y="290" width="60" height="44" rx="3" fill="#9b7fc4"/><text x="550" y="316" fill="#fff" font-size="9.5">z⁽⁰⁾</text>
    <rect x="582" y="290" width="60" height="44" rx="3" fill="#9b7fc4"/><text x="612" y="316" fill="#fff" font-size="9.5">z⁽¹⁾</text>
    <rect x="644" y="290" width="60" height="44" rx="3" fill="#9b7fc4"/><text x="674" y="316" fill="#fff" font-size="9.5">z⁽²⁾</text>
    <rect x="706" y="290" width="60" height="44" rx="3" fill="#9b7fc4"/><text x="736" y="316" fill="#fff" font-size="9.5">z⁽³⁾</text>
    <rect x="792" y="290" width="132" height="44" rx="4" fill="#3b75c4"/><text x="858" y="312" fill="#fff">g=Y₃ᵀδ ; x₃+=ηg</text><text x="858" y="326" fill="#cfe0f5" font-size="9">local update</text>
  </g>

  <!-- serial-recurrence chain arrows on P0's inner loop (z0->z1->z2->z3) -->
  <g stroke="#7a4fa3" stroke-width="2" fill="none" marker-end="url(#ak)">
    <line x1="580" y1="144" x2="582" y2="144"/>
    <line x1="642" y1="144" x2="644" y2="144"/>
    <line x1="704" y1="144" x2="706" y2="144"/>
  </g>
  <text x="643" y="352" font-size="10" font-weight="600" fill="#7a4fa3" text-anchor="middle">→ each z⁽ʲ⁾ depends on δ&lt;ⱼ  (chained, serial)  — recomputed identically on every rank</text>

  <!-- time arrow -->
  <line x1="120" y1="372" x2="930" y2="372" stroke="#444" marker-end="url(#ad)"/>
  <text x="120" y="388" font-size="11" fill="#444">time →</text>

  <!-- takeaways -->
  <text x="28" y="408" font-size="12" fill="#333"><tspan font-weight="700" fill="#2c5e9e">Parallel:</tspan> all ranks run every local phase at once (spatial parallelism over feature columns).  <tspan font-weight="700" fill="#bb7a30">Serial #1:</tspan> the single AllReduce barrier.</text>
  <text x="28" y="425" font-size="12" fill="#333"><tspan font-weight="700" fill="#7a4fa3">Serial #2:</tspan> the inner s-step loop is a chained recurrence within each rank — done redundantly on all ranks to buy s−1 fewer syncs.</text>
</svg>
